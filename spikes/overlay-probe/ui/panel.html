<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>game-overlai panel</title>
<style>
  :root {
    --bg: rgba(18, 18, 24, 0.94);
    --border: rgba(255, 255, 255, 0.12);
    --text: #e8e8ee;
    --muted: #9a9aa8;
    --accent: #6366f1;
    --user: rgba(99, 102, 241, 0.22);
    --composer-h: 54px;
  }
  html, body {
    margin: 0; height: 100%;
    background: transparent;            /* the window itself is transparent */
    font: 14px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }
  /* The window is sized exactly to the panel by the core: the panel fills it. */
  #panel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  #panel.hidden { opacity: 0; }

  #history {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto;
    padding: 12px 14px 4px;
    opacity: 0; transform: translateY(10px);
    transition: opacity 160ms ease, transform 200ms cubic-bezier(.2,.8,.2,1);
    user-select: text;
  }
  #panel.expanded #history { opacity: 1; transform: none; }
  .msg { margin: 0 0 10px; padding: 8px 11px; border-radius: 10px; white-space: pre-wrap; }
  .msg.user { background: var(--user); margin-left: 60px; }
  .msg.ai { background: rgba(255,255,255,0.04); margin-right: 30px; }
  .msg .shot { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }

  #composer {
    flex: 0 0 var(--composer-h); height: var(--composer-h); box-sizing: border-box;
    display: flex; align-items: center; gap: 8px;
    padding: 0 8px 0 12px;
    border-top: 1px solid transparent;
  }
  #panel.expanded #composer { border-top-color: var(--border); }
  #game { font-size: 12px; color: var(--muted); white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 8px; padding: 3px 7px; cursor: pointer; font-size: 13px; line-height: 1.2;
  }
  .btn:hover { background: rgba(255,255,255,0.08); }
  #cam { opacity: .45; }
  #cam.on { opacity: 1; border-color: var(--accent); }
  #close { border-color: transparent; color: var(--muted); font-size: 15px; }
  #close:hover { color: var(--text); }
  #input {
    flex: 1; min-width: 0;
    background: transparent; border: none; outline: none;
    color: var(--text); font: inherit; font-size: 15px;
  }
  #input::placeholder { color: var(--muted); }
  #agent { font-size: 12px; color: var(--muted); white-space: nowrap; }
  /* capture mode: keys come from the keyboard hook, the game keeps focus */
  #kbd { display: none; font-size: 12px; padding: 2px 6px; border-radius: 6px; background: var(--accent); color: #fff; }
  #panel.capture #kbd { display: inline-block; }
  #panel.capture.paused #kbd { background: rgba(255,255,255,0.12); color: var(--muted); }
  #panel.capture:not(.paused) #input { caret-color: transparent; }
  #panel.capture:not(.paused) #composer::after {
    content: ""; width: 2px; height: 18px; background: var(--text);
    margin-left: -8px; animation: blink 1s steps(1) infinite; order: 4;
  }
  #input { order: 3; } #agent { order: 5; } #close { order: 6; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="panel" class="hidden">
  <div id="history"></div>
  <div id="composer">
    <span id="game">🎮 —</span>
    <button id="cam" class="btn on" title="Приложить кадр игры">📷</button>
    <span id="kbd" title="Ввод перехвачен: игра не теряет фокус">⌨</span>
    <input id="input" placeholder="Спросите про игру…" autocomplete="off" spellcheck="false">
    <span id="agent">Claude ▾</span>
    <button id="close" class="btn" title="Скрыть (Esc)">✕</button>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const panel = $("panel"), input = $("input"), history = $("history");
  const post = (path, body) => fetch(path, { method: "POST", body: body ?? "" }).catch(() => {});
  const log = (m) => post("/api/log", m);
  const PH_FOCUS = "Спросите про игру…";
  const PH_CAPTURE = "Печатайте — игра не теряет фокус…";
  const PH_PAUSED = "Alt+W — продолжить ввод · ✕ — скрыть";

  function setMode(mode) {
    panel.classList.toggle("expanded", mode === "expanded");
  }

  function submit() {
    const text = input.value.trim();
    if (!text) return;
    if (!panel.classList.contains("expanded")) {
      history.innerHTML = "";               // quick field = new chat
      post("/api/mode", "expanded");        // core grows the window upward
    }
    addMsg("user", text, $("cam").classList.contains("on"));
    input.value = "";
    setMode("expanded");
    fakeAnswer();
  }

  // Called by the core via webview eval.
  window.__overlay = {
    show(mode, game, capture) {
      $("game").textContent = "🎮 " + (game || "—");
      setMode(mode);
      panel.classList.remove("hidden");
      panel.classList.toggle("capture", !!capture);
      panel.classList.remove("paused");
      input.readOnly = !!capture;
      input.placeholder = capture ? PH_CAPTURE : PH_FOCUS;
      if (!capture) {
        input.focus();
        setTimeout(() => {
          input.focus();
          log(`shown mode=${mode} focus-mode hasFocus=${document.hasFocus()} active=${document.activeElement && document.activeElement.id}`);
        }, 30);
      } else {
        log(`shown mode=${mode} capture-mode hasFocus=${document.hasFocus()}`);
      }
    },
    hidden() { panel.classList.add("hidden"); },
    vkey(ev) {
      if (ev.t === "char") input.value += ev.c;
      else if (ev.t === "back") input.value = input.value.slice(0, -1);
      else if (ev.t === "enter") submit();
    },
    inputMode(on) {
      panel.classList.toggle("paused", !on);
      input.placeholder = on ? PH_CAPTURE : PH_PAUSED;
    },
  };

  function hide() { panel.classList.add("hidden"); post("/api/hide"); }

  $("cam").addEventListener("click", () => $("cam").classList.toggle("on"));
  $("close").addEventListener("click", hide);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); hide(); return; }
    if (e.key === "Enter") { e.preventDefault(); submit(); }
  });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") hide(); });

  function addMsg(who, text, shot) {
    const d = document.createElement("div");
    d.className = "msg " + who;
    d.textContent = text;
    if (shot) { const s = document.createElement("span"); s.className = "shot"; s.textContent = "📷 кадр приложен"; d.appendChild(s); }
    history.appendChild(d);
    history.scrollTop = history.scrollHeight;
    return d;
  }

  function fakeAnswer() {
    const d = addMsg("ai", "");
    const words = "Это заглушка ответа: так будет выглядеть потоковый ответ модели, который приходит по кусочкам, пока вы продолжаете играть.".split(" ");
    let i = 0;
    const t = setInterval(() => {
      d.textContent += (i ? " " : "") + words[i++];
      history.scrollTop = history.scrollHeight;
      if (i >= words.length) clearInterval(t);
    }, 60);
  }

  window.addEventListener("blur", () => log("page blur"));
  post("/api/ready", String(performance.now() | 0));
</script>
</body>
</html>
