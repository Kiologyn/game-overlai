[package]
name = "acp-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = { version = "5.4.0", features = ["process"] }
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.23.1"
image = { version = "0.25", default-features = false, features = ["png"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
uuid = { version = "1.29.3", features = ["v4"] }
