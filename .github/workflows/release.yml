# A pushed tag v<version> (the version in web/package.json) builds the installer and the
# portable exe, signs the installer for the in-app updater and publishes a GitHub release with
# latest.json, which installed copies read to offer the update. A tag with a suffix
# (v0.3.0-beta.1) makes a pre-release: installed copies don't see it.
#
# Run by hand (Actions → Release → Run workflow, or `gh workflow run release.yml --ref dev`):
# a dry run of the same build that publishes nothing; the files are attached to the run.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updater key; a dry
# run without them skips that signature).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the release

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: windows-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag and the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (Get-Content web/package.json -Raw | ConvertFrom-Json).version
          if ($env:PUBLISH -eq "true" -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME does not match the version $version in web/package.json"
          }
          $signed = [bool]$env:TAURI_SIGNING_PRIVATE_KEY
          if (-not $signed -and $env:PUBLISH -eq "true") {
            throw "The secret TAURI_SIGNING_PRIVATE_KEY is missing: installed copies could not verify the update"
          }
          if (-not $signed) { "::warning::No updater key: this dry run skips the updater signature and latest.json" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV
          "PRERELEASE=$($version.Contains('-'))" >> $env:GITHUB_ENV
          "UPDATER_SIGNED=$signed" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the web interface
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "the web build failed" }

      - name: Build game-overlai and its installer
        working-directory: src-tauri
        run: |
          & ../web/node_modules/.bin/tauri.cmd build
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Collect the files
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item src-tauri/target/release/game-overlai.exe "out/game-overlai-$env:VERSION-portable.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/game-overlai_${env:VERSION}_x64-setup.exe" "out/game-overlai-$env:VERSION-setup.exe"
          Get-ChildItem out | Format-Table Name, Length

      - name: Sign the installer for the updater, write latest.json
        if: env.UPDATER_SIGNED == 'True'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $setup = "game-overlai-$env:VERSION-setup.exe"
          & ./web/node_modules/.bin/tauri.cmd signer sign --app-version $env:VERSION "out/$setup"
          if ($LASTEXITCODE -ne 0) { throw "signing for the updater failed" }
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases"
          [ordered]@{
            version   = $env:VERSION
            notes     = "$base/tag/$env:TAG"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "out/$setup.sig" -Raw).Trim()
                url       = "$base/download/$env:TAG/$setup"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content out/latest.json -Encoding utf8NoBOM # serde rejects a BOM
          Get-Content out/latest.json

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @("--title", "game-overlai $env:VERSION", "--generate-notes", "--verify-tag")
          if ($env:PRERELEASE -eq "True") { $flags += "--prerelease" }
          gh release create $env:TAG (Get-ChildItem out -File).FullName @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      - name: Attach the files to the run (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: game-overlai-${{ env.VERSION }}
          path: out/
          if-no-files-found: error
