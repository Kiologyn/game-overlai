[package]
name = "game-overlai"
# The app's version lives in web/package.json (tauri.conf.json and build.rs read it from there):
# change it with `npm version <x.y.z>` in web/.
version = "0.0.0"
description = "AI assistant overlay for any game"
edition = "2024"
default-run = "game-overlai"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
futures-util = "0.3"
rust-embed = { version = "8", features = ["mime-guess"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ts-rs = "12"

anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
agent-client-protocol = { version = "5.4.0", features = ["process", "unstable_session_options"] }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
base64 = "0.23"
rusqlite = { version = "0.43", features = ["bundled"] }
fast_image_resize = "6.2.0"
tauri-runtime = "=2.12.4"
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }
local-ip-address = "0.6.13"
tauri-plugin-notification = "2.8.1"
tauri-plugin-updater = "2.14.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] } # decode in tests

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Debug builds: light optimisation for our crate too. Generic image code (fast_image_resize) is
# compiled into it: scaling a frame for the agent takes ~520 ms at opt-level 0, ~6 ms at 1.
[profile.dev]
opt-level = 1

# Frame encoding is ~10x slower unoptimised; keep debug builds usable.
[profile.dev.package.jpeg-encoder]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.fast_image_resize]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.base64]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
