# A pushed tag v<version> (the version in web/package.json) builds the installer and the
# portable exe, signs the installer for the in-app updater and publishes a GitHub release with latest.json, which installed copies read
# to offer the update. A tag with a suffix (v0.3.0-beta.1) makes a pre-release: installed
# copies don't see it.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updater key).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag and the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (Get-Content web/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME does not match the version $version in web/package.json"
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "The secret TAURI_SIGNING_PRIVATE_KEY is missing: installed copies could not verify the update"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "PRERELEASE=$($version.Contains('-'))" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the web interface
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build game-overlai and its installer
        working-directory: src-tauri
        run: |
          & ../web/node_modules/.bin/tauri.cmd build
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Collect the files
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item src-tauri/target/release/game-overlai.exe "out/game-overlai-$env:VERSION-portable.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/game-overlai_${env:VERSION}_x64-setup.exe" "out/game-overlai-$env:VERSION-setup.exe"

      - name: Sign the installer for the updater, write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $setup = "game-overlai-$env:VERSION-setup.exe"
          & ./web/node_modules/.bin/tauri.cmd signer sign --app-version $env:VERSION "out/$setup"
          if ($LASTEXITCODE -ne 0) { throw "signing for the updater failed" }
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases"
          [ordered]@{
            version   = $env:VERSION
            notes     = "$base/tag/$env:GITHUB_REF_NAME"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "out/$setup.sig" -Raw).Trim()
                url       = "$base/download/$env:GITHUB_REF_NAME/$setup"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content out/latest.json -Encoding utf8
          Get-Content out/latest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @("--title", "game-overlai $env:VERSION", "--generate-notes", "--verify-tag")
          if ($env:PRERELEASE -eq "True") { $flags += "--prerelease" }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem out -File).FullName @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
